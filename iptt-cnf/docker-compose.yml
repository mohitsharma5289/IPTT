# Local development stack. Mirrors the OpenShift topology: PostgreSQL with a
# persistent volume, migrations as a separate one-shot step, then the API.
#
# NETWORK: the stack attaches to the container runtime's existing default
# network rather than creating one of its own, so `podman network ls` shows no
# new entry and the containers sit on whatever the host already routes. The
# name is the podman default; set PODMAN_NETWORK to use another, or see the
# commented block at the foot of this file to go back to a project-owned
# dual-stack bridge.
#
# Two consequences of using the default network, both worth knowing:
#
#   * DNS. Podman's default "podman" network ships with dns_enabled: false,
#     while user-defined networks enable it. Without DNS the hostnames below
#     (db, api) do not resolve and the API cannot reach the database. Check
#     with:  podman network inspect podman --format '{{.DNSEnabled}}'
#     If that prints false, either enable DNS on the network or create a
#     user-defined one - the commented block at the foot of this file.
#
#   * IPv6. The address families now come from that network, not from here.
#     The containers still bind the IPv6 wildcard and serve both families, but
#     they only get a v6 address if the default network provides one. Check
#     with: podman network inspect podman --format '{{.IPv6Enabled}}'
#
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iptt
      POSTGRES_PASSWORD: iptt
      POSTGRES_DB: iptt
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iptt -d iptt"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    entrypoint: ["/app/entrypoint.sh", "migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://iptt:iptt@db:5432/iptt
      SESSION_SECRET: local-development-secret-not-for-deployment
    depends_on:
      db: {condition: service_healthy}

  # Creates the first administrator. The migrations seed reference data only,
  # never identities, so without this the app_user table is empty and the login
  # form has no credentials that could possibly work. Set
  # BOOTSTRAP_ADMIN_PASSWORD to choose one; leave it unset and a password is
  # generated and printed once - read it with `podman-compose logs bootstrap`.
  # Either way the account must change its password at first sign-in.
  bootstrap:
    build: ./backend
    entrypoint: ["/app/entrypoint.sh", "bootstrap"]
    environment:
      DATABASE_URL: postgresql+psycopg://iptt:iptt@db:5432/iptt
      SESSION_SECRET: local-development-secret-not-for-deployment
      LOG_JSON: "false"
      BOOTSTRAP_ADMIN_USERNAME: admin
    depends_on:
      migrate: {condition: service_completed_successfully}

  api:
    build: ./backend
    entrypoint: ["/app/entrypoint.sh", "serve"]
    environment:
      DATABASE_URL: postgresql+psycopg://iptt:iptt@db:5432/iptt
      SESSION_SECRET: local-development-secret-not-for-deployment
      ENVIRONMENT: local
      SESSION_HTTPS_ONLY: "false"
      LOG_JSON: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      bootstrap: {condition: service_completed_successfully}

  web:
    build: ./frontend
    environment:
      # The browser talks only to the frontend origin; Next proxies /api to the
      # backend, so the session cookie stays first-party and CORS never applies.
      API_ORIGIN: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_started}

volumes:
  pgdata:

networks:
  # "default" is the network compose puts every service on when none is named.
  # Pointing it at an existing network with external: true stops compose from
  # creating and tearing down one of its own.
  default:
    # "podman" is the default network on the target VMs. Named literally rather
    # than through a variable, so this does not depend on the compose
    # implementation supporting ${VAR:-default} interpolation. To run against a
    # different network, change this one value - it must already exist.
    name: podman
    external: true

# To go back to a project-owned dual-stack bridge instead - useful if the
# default network has DNS disabled, or has no IPv6 - delete the block above,
# add "networks: [iptt]" to each service, and uncomment:
#
# networks:
#   iptt:
#     enable_ipv6: true
#     ipam:
#       config:
#         - subnet: 172.31.240.0/24
#         - subnet: fd3a:9c21:44b7:1::/64
