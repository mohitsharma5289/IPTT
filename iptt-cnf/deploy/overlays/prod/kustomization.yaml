apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: iptt
resources:
  - ../../base

replicas:
  - name: iptt-api
    count: 3
  - name: iptt-web
    count: 2

patches:
  - target: { kind: ConfigMap, name: iptt-config }
    patch: |
      - op: replace
        path: /data/ENVIRONMENT
        value: "prod"
  - target: { kind: StatefulSet, name: iptt-postgres }
    patch: |
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 50Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 4Gi
  # Set the public hostname for this cluster before applying.
  # - target: { kind: Route, name: iptt }
  #   patch: |
  #     - op: add
  #       path: /spec/host
  #       value: iptt.apps.example.com
