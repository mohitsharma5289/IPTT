apiVersion: apps/v1
kind: Deployment
metadata:
  name: iptt-api
  labels:
    app.kubernetes.io/name: iptt
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: iptt
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iptt
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas so one node draining does not take the API down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: iptt
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: iptt-api:latest
          command: ["/app/entrypoint.sh", "serve"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: iptt-config }
            - secretRef:    { name: iptt-app }
          env:
            - name: WEB_CONCURRENCY
              value: "4"
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: "2",  memory: 1Gi }
          # Liveness deliberately does not touch the database: a database blip
          # should not cause OpenShift to restart otherwise-healthy pods.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
