# EXAMPLE ONLY — do not apply this file and do not commit real values.
#
# Create the real Secrets out of band, for example:
#
#   oc create secret generic iptt-db \
#     --from-literal=POSTGRES_USER=iptt \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 32)"
#
#   oc create secret generic iptt-app \
#     --from-literal=SESSION_SECRET="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" \
#     --from-literal=DATABASE_URL="postgresql+psycopg://iptt:<password>@iptt-postgres:5432/iptt"
#
# The application refuses to start outside `local` if SESSION_SECRET is the
# development default or shorter than 32 characters — the legacy app shipped
# "iptt-secret-key-change-later" hardcoded in main.py, which let anyone with the
# repository forge an admin session cookie (audit B4).
apiVersion: v1
kind: Secret
metadata:
  name: iptt-db
type: Opaque
stringData:
  POSTGRES_USER: "iptt"
  POSTGRES_PASSWORD: "replace-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: iptt-app
type: Opaque
stringData:
  SESSION_SECRET: "replace-me-with-at-least-32-random-characters"
  DATABASE_URL: "postgresql+psycopg://iptt:replace-me@iptt-postgres:5432/iptt"
