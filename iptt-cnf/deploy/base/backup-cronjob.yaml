# Nightly logical backup to its own PVC, with retention.
#
# The legacy system had no backup of any kind: the database was a single SQLite
# file, and a failed re-baseline could destroy every recorded actual with no way
# back (audit C4, B7).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iptt-backups
  labels:
    app.kubernetes.io/name: iptt
    app.kubernetes.io/component: backup
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: iptt-backup
  labels:
    app.kubernetes.io/name: iptt
    app.kubernetes.io/component: backup
spec:
  schedule: "30 18 * * *"          # 00:00 IST
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: iptt
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: quay.io/sclorg/postgresql-16-c9s:latest
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  target="/backups/iptt-${stamp}.dump"
                  echo "dumping to ${target}"
                  pg_dump --format=custom --compress=6 \
                          --host="${PGHOST}" --username="${PGUSER}" \
                          --dbname="${PGDATABASE}" --file="${target}"
                  echo "verifying"
                  pg_restore --list "${target}" > /dev/null
                  # Retention: keep 14 days of dumps.
                  find /backups -name 'iptt-*.dump' -type f -mtime +14 -delete
                  echo "done; current contents:"
                  ls -lh /backups
              env:
                - name: PGHOST
                  value: iptt-postgres
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef: { name: iptt-config, key: POSTGRES_DB }
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: { name: iptt-db, key: POSTGRES_USER }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: iptt-db, key: POSTGRES_PASSWORD }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits:   { cpu: "1",  memory: 1Gi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: iptt-backups
