apiVersion: v1
kind: Service
metadata:
  name: iptt-web
  labels:
    app.kubernetes.io/name: iptt
    app.kubernetes.io/component: web
spec:
  # Dual-stack: the Service gets a ClusterIP in both families where the
  # cluster provides them, and falls back to whichever single family
  # exists. Without this a Service defaults to SingleStack in the
  # cluster's primary family only.
  ipFamilyPolicy: PreferDualStack
  selector:
    app.kubernetes.io/name: iptt
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
