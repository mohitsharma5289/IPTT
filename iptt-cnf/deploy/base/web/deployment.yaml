apiVersion: apps/v1
kind: Deployment
metadata:
  name: iptt-web
  labels:
    app.kubernetes.io/name: iptt
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: iptt
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iptt
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: iptt
              app.kubernetes.io/component: web
      containers:
        - name: web
          image: iptt-web:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            # NO API_ORIGIN here. Next evaluates rewrites during `next build`
            # and serialises them into routes-manifest.json, which the
            # standalone server reads at startup - so a runtime value is
            # silently ignored and the pod proxies to the built-in default,
            # failing with ECONNREFUSED. The image is built against
            # http://iptt-api:8000, which is Service/iptt-api. To change it,
            # rebuild with --build-arg API_ORIGIN=..., never with an env var.
            - name: NODE_ENV
              value: "production"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 512Mi }
          livenessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 5
            failureThreshold: 24
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
